name: Unity Security CI (v2 - Production Grade)

on:
  push:
  pull_request:

env:
  UNITY_DIR: 2.4-UNITY-GROEP

jobs:

  # -------------------------
  # SAST (REAL Unity-aware scanning)
  # -------------------------
  semgrep:
    name: Semgrep (C# + Unity Security Rules)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (Unity focused)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/csharp
            p/security-audit
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # -------------------------
  # Secrets + filesystem risk scanning
  # -------------------------
  gitleaks:
    name: Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------
  # Unity Package Security (UPM-aware scan)
  # -------------------------
  unity-packages:
    name: Unity Package Security (UPM Analysis)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Unity project structure
        run: |
          test -f "$UNITY_DIR/Packages/manifest.json"

      # Lightweight but effective dependency extraction
      - name: Extract Unity package list
        run: |
          cat "$UNITY_DIR/Packages/manifest.json"

      # GitHub-native CVE matching via dependency graph
      - name: Dependency Review (GitHub Security Advisory matching)
        uses: actions/dependency-review-action@v4
        with:
          base-ref: main
          head-ref: ${{ github.ref }}

  # -------------------------
  # Filesystem security scan (Trivy - LIMITED scope)
  # -------------------------
  trivy-fs:
    name: Trivy (Secrets + Misconfig only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Unity project (high signal only)
        run: |
          trivy fs \
            --scanners secret,misconfig \
            --severity HIGH,CRITICAL \
            "$UNITY_DIR"

  # -------------------------
  # SBOM (UPM-aware snapshot)
  # -------------------------
  sbom:
    name: SBOM (Unity Project Snapshot)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.UNITY_DIR }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: unity-sbom
          path: sbom.json