name: Unity Security CI (Proper SCA)

on:
  push:
  pull_request:

env:
  UNITY_DIR: 2.4-UNITY-GROEP

jobs:

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/csharp

  sca:
    name: Unity SCA (Real Dependency Graph)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # -------------------------
      # 1. Validate Unity lockfile
      # -------------------------
      - name: Validate Unity lockfile
        run: |
          test -f "$UNITY_DIR/Packages/packages-lock.json"

      # -------------------------
      # 2. Generate SBOM (source of truth)
      # -------------------------
      - name: Generate SBOM
        run: |
          trivy fs \
            --format cyclonedx \
            --output sbom.json \
            "$UNITY_DIR"

      # -------------------------
      # 3. Vulnerability scan (REAL SCA)
      # -------------------------
      - name: Scan SBOM for vulnerabilities
        run: |
          trivy sbom \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            sbom.json

      # -------------------------
      # 4. Secret scanning
      # -------------------------
      - name: Secret scan
        run: |
          trivy fs \
            --scanners secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$UNITY_DIR"

  sbom_publish:
    name: SBOM Artifact
    runs-on: ubuntu-latest
    needs: sca
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: unity-sbom
          path: sbom.json